name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR ではビルドだけ確認する (デプロイはしない)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vp install (pnpm) まで実行される。Node は .node-version に固定
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # 整形・lint・型チェック
      - name: Check
        run: vp check

      - name: Build
        run: vp run build

      # marp-cli の PDF 変換はランナーにプリインストールの Chrome を使う
      - name: Generate PDFs
        run: vp run pdf

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
